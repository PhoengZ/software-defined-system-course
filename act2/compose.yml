name: monitoring

services:
  node-exporter:
    image: prom/node-exporter:latest
    # container_name: node-exporter-1
    ports:
      - "9100"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    volumes:
      - C:\Users\USER\Desktop\Software_def\multiple_container\prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - node-exporter
    # extra_hosts:
    #   - "raspberrypi:172.20.10.4"
  
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    volumes:
      - grafana-vol:/var/lib/grafana

volumes:
  grafana-vol:

networks:
  monitoring:
    driver: bridge